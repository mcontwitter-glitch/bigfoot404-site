<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Wholesale CRM | Bigfoot 404</title>
<meta name="description" content="Bigfoot404 LLC Wholesale CRM — leads, cash buyers, contracts, and deals pipeline."/>
<link rel="icon" type="image/png" href="assets/logo-bw.png"/>
<style>
:root{
  --bg:#000000;
  --panel:#0a120c;
  --green:#3dff7a;
  --green-dim:#1c7a3c;
  --green-glow:rgba(61,255,122,.55);
  --text:#d9ffe4;
  --dim:#7ea88c;
  --border:rgba(61,255,122,.28);
  --gold:#e8c35a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Verdana,Arial,Helvetica,sans-serif;width:100%;height:100%}
body{display:flex;flex-direction:column;min-height:100vh}
a{color:var(--green);text-decoration:none}
a:hover{text-decoration:underline}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
  padding:14px 24px;border-bottom:1px solid var(--border);
  background:radial-gradient(ellipse 70% 120% at 50% -60%,rgba(30,120,60,.22),transparent 70%),var(--panel)}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:42px;height:42px;filter:grayscale(1) drop-shadow(0 0 8px var(--green-glow));background:#fff;border-radius:6px;padding:4px}
.brand-text h1{font-size:17px;letter-spacing:.04em;color:#fff}
.brand-text p{font-size:10.5px;color:var(--dim);letter-spacing:.08em;margin-top:2px}
.bar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--border);background:rgba(61,255,122,.05);padding:7px 13px;transition:.15s}
.pill:hover{color:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(61,255,122,.2);text-decoration:none}
.pill.cta{color:#000;background:var(--green);border-color:var(--green);font-weight:bold}
.pill.cta:hover{box-shadow:0 0 14px var(--green-glow);color:#000}
/* ---- token gate ---- */
.crm-stage{flex:1;display:flex;position:relative;min-height:520px}
.gated{flex:1;position:relative;display:flex;min-height:520px;height:calc(100vh - 72px)}
.crm-frame{flex:1;width:100%;border:none;background:#fff;height:100%;min-height:520px}
.is-locked{filter:blur(6px);pointer-events:none;user-select:none}
.gate-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(6,12,7,.78);z-index:40;pointer-events:auto;filter:none}
.gate-box{text-align:center;padding:28px 32px;border-radius:14px;background:#101a10;
  border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 40px rgba(0,0,0,.5);max-width:380px}
.gate-box .gate-icon{font-size:30px;margin-bottom:8px}
.gate-box h4{margin:6px 0 6px;color:#fff;letter-spacing:.04em}
.gate-box p{font-size:13px;opacity:.8;margin:0 0 14px;line-height:1.5}
.gbtn{cursor:pointer;border:0;border-radius:8px;padding:10px 22px;font-weight:600;
  color:#08130a;background:linear-gradient(90deg,#7ef29b,#4ad46f)}
.gate-status.ok{color:#7ef29b;border-color:rgba(126,242,155,.55);background:rgba(61,255,122,.08)}
@media (max-width:640px){
  .bar{padding:10px 14px}
  .brand-text h1{font-size:14px}
}
</style>
</head>
<body>

<div class="bar">
  <a class="brand" href="index.html">
    <img src="assets/logo-bw.png" alt="Bigfoot 404"/>
    <span class="brand-text">
      <h1>BIGFOOT 404</h1>
      <p>WHOLESALE CRM &mdash; BIGFOOT404 LLC</p>
    </span>
  </a>
  <div class="bar-right">
    <a class="pill" href="index.html">Home</a>
    <a class="pill" href="business.html">IRL Business</a>
    <a class="pill" href="https://mcontwitter-glitch.github.io/BIG-Terminal/" target="_blank" rel="noopener">BIG Terminal</a>
    <a class="pill" href="https://mcontwitter-glitch.github.io/lil-foot-leap/" target="_blank" rel="noopener">LIL Foot Leap</a>
    <span class="pill gate-status">Wallet not verified</span>
    <a class="pill cta" id="crmOpen" href="https://big-crm.base44.app" target="_blank" rel="noopener" style="display:none">Open Fullscreen</a>
  </div>
</div>

<!-- TOKEN GATE: the CRM iframe only loads for verified Bigfoot NFT holders.
     Non-holders get the holder lock overlay; the frame stays on about:blank. -->
<div class="crm-stage">
  <div class="gated" id="crmGate">
    <iframe class="crm-frame" id="crmFrame" src="about:blank" title="Bigfoot404 Wholesale CRM" allow="clipboard-write"></iframe>
  </div>
</div>

<noscript>
  <div class="bar"><span class="pill">JavaScript is required to verify holder access to the CRM.</span></div>
</noscript>

<script src="https://unpkg.com/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
<script src="assets/gate.js?v=4"></script>
<script src="assets/walletconnect-appkit.js?v=1"></script>
<script>
  (function () {
    var CRM_URL = "https://big-crm.base44.app";
    var frame = document.getElementById("crmFrame");
    var open = document.getElementById("crmOpen");
    document.addEventListener("bigfoot-gate-change", function (e) {
      var d = e.detail || {};
      if (d.unlocked) {
        if (frame.getAttribute("src") !== CRM_URL) frame.src = CRM_URL;   // load the CRM only after verification
        if (open) open.style.display = "";
      } else {
        frame.src = "about:blank";                                        // locked: no CRM access at all
        if (open) open.style.display = "none";
      }
    });
  })();
</script>

</body>
</html>
